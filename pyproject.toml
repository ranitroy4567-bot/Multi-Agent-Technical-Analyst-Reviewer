[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crewai-ollama-analyst"
version = "0.1.0"
description = "Multi-agent technical analyst and reviewer using CrewAI and local Ollama models"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.80.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
